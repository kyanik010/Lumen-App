name: ARM64 test build

on:
  push:
    branches: [build/arm64-only-test]
    paths:
      - '.github/workflows/arm64-test.yml'
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.38.9

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_COMMUNITY_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_COMMUNITY_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_COMMUNITY_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_COMMUNITY_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_lumenCommunityBuild: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Configure Community APK signing
        shell: bash
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing required GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/community-release.p12
          {
            printf '%s\n' 'storeFile=community-release.p12'
            printf '%s\n' 'storeType=PKCS12'
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/community-release.p12 android/key.properties
      - name: Build ARM64-only APK
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}
      - name: Verify signed ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          echo "Checking native libraries at the APK root..."
          unzip -Z1 "$apk" | grep -E '^lib/arm64-v8a/.*\.so$'
          if ! unzip -Z1 "$apk" | grep -qE '^lib/arm64-v8a/.*\.so$'; then
            echo "No ARM64 native libraries found."
            exit 1
          fi
          forbidden="$(unzip -Z1 "$apk" | grep -E '^lib/(armeabi-v7a|x86|x86_64)/.*\.so$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Unexpected non-ARM64 native libraries found at APK root:"
            printf '%s\n' "$forbidden"
            exit 1
          fi
          echo "ARM64-only native library check passed."
          ls -lh "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: EAGLE-X-ARM64-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
