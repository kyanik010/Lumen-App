name: Build and release Lumen

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_number:
        description: Monotonic release build number (must exceed the current release)
        type: number
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.38.9

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.number.outputs.build_number }}
    steps:
      - name: Calculate a build number above the upstream release
        id: number
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Talha-Ashraf420/Lumen-App/releases/latest \
            | jq -er '.body | capture("build: (?<number>[0-9]+)").number')"
          if [ -n "$REQUESTED_BUILD_NUMBER" ]; then
            build="$REQUESTED_BUILD_NUMBER"
          else
            build=$((current + RUN_NUMBER))
          fi
          case "$build" in
            ''|*[!0-9]*|0) echo "A positive build number is required."; exit 1 ;;
          esac
          if [ "$build" -le "$current" ]; then
            echo "Build $build must exceed current upstream release $current"
            exit 1
          fi
          echo "Using build number $build (upstream latest: $current)"
          echo "build_number=$build" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: [quality, prepare]
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_COMMUNITY_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_COMMUNITY_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_COMMUNITY_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_COMMUNITY_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_lumenCommunityBuild: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Configure Community APK signing
        shell: bash
        run: |
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing required GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/community-release.p12
          {
            printf 'storeFile=community-release.p12\n'
            printf 'storeType=PKCS12\n'
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/community-release.p12 android/key.properties
      - run: flutter build apk --release --build-number=${{ needs.prepare.outputs.build_number }} --dart-define=APP_BUILD=${{ needs.prepare.outputs.build_number }}
      - name: Verify signed, installable Community APK
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "Android apksigner was not found."
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
          build_tools_dir="$(dirname "$apksigner")"
          "$build_tools_dir/aapt" dump badging "$apk" | grep "package: name='com.talhaashraf.lumen.community'"
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    needs: [prepare, android]
    if: ${{ always() && needs.android.result == 'success' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
    steps:
      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Lumen-Android-apk
          path: dist/android
      - name: Stage Android release asset
        run: |
          mkdir -p out
          cp dist/android/app-release.apk out/Lumen-Android.apk
          sha256sum out/Lumen-Android.apk > out/Lumen-Android.apk.sha256
      - name: Publish Android-only release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build ${{ needs.prepare.outputs.build_number }}
          body: |
            build: ${{ needs.prepare.outputs.build_number }}

            Lumen Android / Android TV APK only.
          prerelease: false
          make_latest: true
          files: out/*
      - name: Announce the Android build on Discord
        if: ${{ env.DISCORD_RELEASE_WEBHOOK != '' }}
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          DOWNLOADER_URL: https://aftv.news/4560142
          DOWNLOADER_CODE: "4560142"
        run: |
          jq -n \
            --arg build "$BUILD_NUMBER" \
            --arg downloader "$DOWNLOADER_URL" \
            --arg downloaderCode "$DOWNLOADER_CODE" \
            '{
              username: "Lumen Releases",
              content: ("**New Lumen Android build " + $build + " is available**\n\nAndroid and Android TV\nDownloader code: `" + $downloaderCode + "`\nDownload: " + $downloader)
            }' > discord-payload.json
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data @discord-payload.json \
            "$DISCORD_RELEASE_WEBHOOK"
